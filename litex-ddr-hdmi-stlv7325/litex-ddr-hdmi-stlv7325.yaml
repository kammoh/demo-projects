# xeda design for litex-ddr-hdmi-stlv7325: what `make -C litex-ddr-hdmi-stlv7325 PART=xc7k325tffg676-2` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found.
name: litex-ddr-hdmi-stlv7325
rtl:
  top: sitlinv_stlv7325
  sources:
    - sitlinv_stlv7325.v
    - ../vexriscv/VexRiscv.v
    - sitlinv_stlv7325.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7k325tffg676-2
  nextpnr:
    extra_args: ["--freq", "50"]
  openfpgaloader:
    board: stlv7325_v2
