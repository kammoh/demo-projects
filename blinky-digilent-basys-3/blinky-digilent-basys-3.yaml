# xeda design for blinky-digilent-basys-3: what `make -C blinky-digilent-basys-3` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run fpga_pack blinky-digilent-basys-3/blinky-digilent-basys-3.yaml
name: blinky-digilent-basys-3
description: Blink an LED from a 25-bit counter on the Digilent Basys 3
rtl:
  top: blinky
  sources:
    - blinky.v
    - blinky.xdc

flows:
  yosys_fpga:
    fpga:
      part: xc7a35tcpg236-1
  openfpgaloader:
    board: basys_3
