# Projects that upstream's CI builds and this fork does not build through xeda, each with the
# reason (and, if there is one, the evidence). `xeda_check.py --ci-list` reads this file: a
# project in upstream's workflows with neither a design file nor an entry here is `missing` and
# fails the list. An entry for a project upstream does not build, or for one that also has a
# design file, is an error too.
#
# Names are the directories upstream's workflows build (`picosoc`) or `regression/<case>`:
#
#   excluded:
#     regression/bufr-pad-site:
#       reason: placement-only case, no FASM for xeda's nextpnr to deliver
#       evidence: regression/bufr-pad-site/no_route
#
excluded:
  regression/bufr-pad-site:
    reason: >-
      placement-only case: run.sh stops nextpnr after placement (`--no-route`) and judges the
      placed design, with no FASM; xeda's nextpnr always writes its FASM output and fails a run
      that has none, so there is no xeda build to judge
    evidence: regression/bufr-pad-site/no_route
  regression/bufr-sink-region:
    reason: >-
      placement-only case: run.sh stops nextpnr after placement (`--no-route`) and judges the
      placed design, with no FASM; xeda's nextpnr always writes its FASM output and fails a run
      that has none, so there is no xeda build to judge
    evidence: regression/bufr-sink-region/no_route
