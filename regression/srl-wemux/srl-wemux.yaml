# xeda design for srl-wemux: what `regression/run.sh srl-wemux` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/srl-wemux/srl-wemux.yaml
name: reg-srl-wemux
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a200tfbg484-2
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
