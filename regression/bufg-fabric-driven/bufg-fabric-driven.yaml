# xeda design for the regression case `bufg-fabric-driven`: what `regression/run.sh bufg-fabric-driven` builds
# (`synth_xilinx -flatten -abc9 -nocarry -nodsp`, then nextpnr with `--timing-allow-fail`).
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/bufg-fabric-driven/bufg-fabric-driven.yaml
name: reg-bufg-fabric-driven
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a200tfbg484-2
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
