# xeda design for bufio-in-use: what `regression/run.sh bufio-in-use` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/bufio-in-use/bufio-in-use.yaml
name: reg-bufio-in-use
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a35tcsg324-1
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
