# xeda design for dsp-const-only-pins: what `regression/run.sh dsp-const-only-pins` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/dsp-const-only-pins/dsp-const-only-pins.yaml
name: reg-dsp-const-only-pins
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a200tfbg484-2
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
