# xeda design for fdse-fdpe-undefined-init: what `regression/run.sh fdse-fdpe-undefined-init` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/fdse-fdpe-undefined-init/fdse-fdpe-undefined-init.yaml
name: reg-fdse-fdpe-undefined-init
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7z010clg400-1  # part.txt has no speed grade; xeda needs the full part
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
