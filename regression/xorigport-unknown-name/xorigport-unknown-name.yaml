# xeda design for xorigport-unknown-name: what `regression/run.sh xorigport-unknown-name` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/xorigport-unknown-name/xorigport-unknown-name.yaml
name: reg-xorigport-unknown-name
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a200tfbg484-2
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
