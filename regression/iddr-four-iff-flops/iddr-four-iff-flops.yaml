# xeda design for the regression case `iddr-four-iff-flops`: what `regression/run.sh iddr-four-iff-flops` builds
# (`synth_xilinx -flatten -abc9 -nocarry -nodsp`, then nextpnr with `--timing-allow-fail`).
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/iddr-four-iff-flops/iddr-four-iff-flops.yaml
name: reg-iddr-four-iff-flops
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a200tfbg484-2
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
