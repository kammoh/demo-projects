# xeda design for config-primitive-startupe2: what `regression/run.sh config-primitive-startupe2` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/config-primitive-startupe2/config-primitive-startupe2.yaml
name: reg-config-primitive-startupe2
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a200tfbg484-2
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
