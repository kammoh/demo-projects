# xeda design for the regression case `bram-sdp-unused-port`: what `regression/run.sh bram-sdp-unused-port` builds
# (`synth_xilinx -flatten -abc9 -nocarry -nodsp`, then nextpnr with `--timing-allow-fail`).
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/bram-sdp-unused-port/bram-sdp-unused-port.yaml
name: reg-bram-sdp-unused-port
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a200tfbg484-2
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
