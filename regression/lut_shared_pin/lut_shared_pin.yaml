# xeda design for lut_shared_pin: what `regression/run.sh lut_shared_pin` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/lut_shared_pin/lut_shared_pin.yaml
name: reg-lut_shared_pin
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7z010clg400-1  # part.txt has no speed grade; xeda needs the full part
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
