# xeda design for bufh-clock-constraint: what `regression/run.sh bufh-clock-constraint` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/bufh-clock-constraint/bufh-clock-constraint.yaml
name: reg-bufh-clock-constraint
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a200tfbg484-2
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
