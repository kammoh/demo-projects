# xeda design for lutram-ram32x1s: what `regression/run.sh lutram-ram32x1s` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/lutram-ram32x1s/lutram-ram32x1s.yaml
name: reg-lutram-ram32x1s
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a200tfbg484-2
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
