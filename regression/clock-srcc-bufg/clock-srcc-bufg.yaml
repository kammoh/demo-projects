# xeda design for clock-srcc-bufg: what `regression/run.sh clock-srcc-bufg` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run nextpnr regression/clock-srcc-bufg/clock-srcc-bufg.yaml
name: reg-clock-srcc-bufg
rtl:
  top: top
  sources:
    - top.v
    - top.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7a200tfbg484-2
    nodsp: true
    synth_flags: [-nocarry]
  nextpnr:
    timing_allow_fail: true
    write: top_routed.json
