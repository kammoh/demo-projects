# The repository's recipe for every design built from this directory: the synthesis of `openXC7.mk`
# (`yosys synth_xilinx -flatten -abc9`, with yosys's own abc9 script), so that the FASM is the
# Makefile's. A design file's own `flows` section is applied over it. A build from the design's own
# directory finds no project file and uses xeda's defaults.
#
# Never declare `rtl.clocks` / `clock` in a design whose XDC has its own `create_clock`: xeda would
# add a second one, and an abc9 delay target the Makefile does not have.
flows:
  yosys_fpga:
    flatten: true            # `synth_xilinx -flatten`
    flow3: false             # yosys's default abc9 script, not xeda's `abc9.script.flow3`
    check_assert: false      # openXC7.mk does not run `check -assert`
    read_verilog_flags: []   # plain `read_verilog`: no `-sv`, no `-noautowire`
    systemverilog: default   # yosys's built-in reader, as a bare `yosys <files>` reads
    synth_pass_only: true    # the `synth_xilinx` pass alone, with nothing before it
