# xeda design for picosoc-qmtech: what `make -C picosoc BOARD=qmtech` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found.
name: picosoc-qmtech
rtl:
  top: top
  sources:
    - qmtech.v
    - picosoc_noflash.v
    - picorv32.v
    - progmem.v
    - simpleuart.v
    - picosoc-qmtech.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7k325tffg676-1
