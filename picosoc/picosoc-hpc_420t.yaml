# xeda design for picosoc-hpc_420t: what `make -C picosoc BOARD=hpc_420t` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found.
name: picosoc-hpc_420t
rtl:
  top: top
  sources:
    - hpc_420t.v
    - picosoc_noflash.v
    - picorv32.v
    - progmem.v
    - simpleuart.v
    - picosoc-hpc_420t.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7k420tffg901-1
