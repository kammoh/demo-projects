# xeda design for hdmi-stlv7325: what `make -C hdmi-stlv7325` builds, from the LiteX SoC of `hdmi_demo.py`.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run yosys_fpga hdmi-stlv7325/hdmi-stlv7325.yaml
name: hdmi-stlv7325
description: Colorbars on HDMI (TMDS_33) on the STLV7325-v2, a LiteX SoC without a CPU
rtl:
  top: sitlinv_stlv7325_v2
  generator:
    executable: python3
    args: ["hdmi_demo.py", "--build", "--no-compile-gateware", "--output-dir", "build"]
    # xeda tracks `hdmi_demo.py`, not LiteX itself: after upgrading LiteX, use `--rebuild-all`
    sources: ["hdmi_demo.py"]
    generated_sources:
      - "build/gateware/sitlinv_stlv7325_v2.v"
      - "build/gateware/sitlinv_stlv7325_v2_mem.init"
  sources:
    - "build/gateware/sitlinv_stlv7325_v2.v"
    # the ROM image that the Verilog's `$readmemh` reads: a `Data` source, so that xeda hashes and ships it
    - path: "build/gateware/sitlinv_stlv7325_v2_mem.init"
      type: Data
    - "hdmi_demo.xdc"

flows:
  yosys_fpga:
    fpga.part: xc7k325tffg676-2
  openfpgaloader:
    board: stlv7325_v2
