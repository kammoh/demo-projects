# xeda design for hdmi-stlv7325: the LiteX SoC of `hdmi_demo.py`, regenerated by xeda itself.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run yosys_fpga hdmi-stlv7325/hdmi-stlv7325.yaml
#
# The Verilog is not checked in for this design: `rtl.generator` runs `hdmi_demo.py` (LiteX) when
# the design is loaded, and runs it again only when something it reads changed, judged by content:
#   - `sources`: the script itself, and the LiteX packages it imports. They are the ones in
#     `sys.modules` after a real `hdmi_demo.py --build`, named as directories (a directory counts
#     as every file in it):
#       litex         $LITEX_DIR         the SoC, the builder and the Verilog back end
#       litex_boards  $LITEX_BOARDS_DIR  `platforms/sitlinv_stlv7325_v2`, the board's pins and
#                                        constraints
#       migen         $MIGEN_DIR         the HDL it is all written in
#     No CPU is selected, so no `pythondata_cpu_*` core and none of the other LiteX cores
#     (`litedram`, `liteeth`, ...) is imported. `colorama` and `packaging` are loaded too; they
#     are general-purpose third-party packages, not LiteX, and are not named.
#     Where those directories are depends on how LiteX was installed (an editable clone for
#     `litex` and `litex_boards`, a copy in the virtual environment's `site-packages` for a
#     `pip install migen`), so no relative or absolute spelling holds on another machine:
#     xeda expands environment variables in these paths, from its own environment, and the
#     three are the package directories of the interpreter the generator runs (`python3` on its
#     `PATH`). Set them before `xeda run`:
#       eval "$(python3 - <<'PY'
#       import os, shlex, litex, litex_boards, migen
#       for var, pkg in ("LITEX_DIR", litex), ("LITEX_BOARDS_DIR", litex_boards), ("MIGEN_DIR", migen):
#           print(f"export {var}={shlex.quote(os.path.dirname(pkg.__file__))}")
#       PY
#       )"
#     `xeda_check.py` does that itself for the interpreter it gives the generator. A variable that
#     is not set leaves its path unexpanded, which xeda refuses at load: no such file. Xeda cannot
#     see which copy of a package the interpreter imports, so a package reinstalled from other
#     sources, or another interpreter, changes the design without changing what is named here:
#     `xeda run --rebuild-all` is for that.
# `xeda run --rebuild-all` generates again regardless. A load with no run root to keep a record
# in (a `Design` built by hand) cannot judge it and generates; `xeda run --dry-run` refuses to
# plan a design that has to generate, and creates nothing.
#
# LiteX names every output after the platform, so the files below are `sitlinv_stlv7325_v2*`,
# not `hdmi_demo*` as the 2023 LiteX the checked-in `hdmi_demo.v` came from named them, and the
# top module is `sitlinv_stlv7325_v2`. The Verilog `$readmemh`s the `.init` (LiteX's SoC
# identifier string, with the build date in it) next to it; it is declared as a `Data` source so
# that `--remote` ships it before the run, where yosys's own list of files read does not exist yet.
# Neither file exists before the first generation, hence `path:` rather than `file:`.
#
# `build/` is the generator's output directory (ignored by git): the script writes more than the
# two sources there, among them its own `sitlinv_stlv7325_v2.xdc`. That one is not used: the
# design's constraints are `hdmi_demo.xdc`, hand-maintained for openXC7 (its Vivado-only
# properties and some false paths are commented out), and generating beside it would overwrite it.
#
# `make` builds the same two files (`hdmi-stlv7325/Makefile` names them), with `hdmi_demo.xdc` too, but
# does not run LiteX: it stops, naming the command, when they are absent. There is no checked-in
# netlist. LiteX stamps its build date into the ROM image (`.init`), which is design content, so
# one generation is not the same design as another's; `SOURCE_DATE_EPOCH` pins that date (LiteX
# honors it), which `xeda_check.py` sets so that both routes build one design. The Verilog's own
# `// Date` comments are the wall clock whatever it says, so the file never repeats byte for byte.
name: hdmi-stlv7325
description: Colorbars on HDMI (TMDS_33) on the STLV7325-v2, a LiteX SoC without a CPU
rtl:
  top: sitlinv_stlv7325_v2
  generator:
    executable: python3
    args: ["hdmi_demo.py", "--build", "--no-compile-gateware", "--output-dir", "build"]
    sources: ["hdmi_demo.py", "$LITEX_DIR", "$LITEX_BOARDS_DIR", "$MIGEN_DIR"]
    generated_sources:
      - "build/gateware/sitlinv_stlv7325_v2.v"
      - "build/gateware/sitlinv_stlv7325_v2_mem.init"
  sources:
    - path: "build/gateware/sitlinv_stlv7325_v2.v"
    - path: "build/gateware/sitlinv_stlv7325_v2_mem.init"
      type: Data
    - "hdmi_demo.xdc"

flows:
  yosys_fpga:
    fpga:
      part: xc7k325tffg676-1
