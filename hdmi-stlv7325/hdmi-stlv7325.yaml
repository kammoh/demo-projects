# xeda design for hdmi-stlv7325: the LiteX SoC of `hdmi_demo.py`, regenerated by xeda itself.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run yosys_fpga hdmi-stlv7325/hdmi-stlv7325.yaml
#
# The Verilog is not checked in for this design: `rtl.generator` runs `hdmi_demo.py` (LiteX) when
# the design is loaded, and runs it again only when something it reads changed, judged by content:
#   - `sources`: the script itself;
#   - `packages`: the installed Python packages the script reaches, which no design can list as
#     files. They are the LiteX ones in `sys.modules` after a real `hdmi_demo.py --build`:
#       litex         the SoC, the builder and the Verilog back end
#       litex_boards  `platforms/sitlinv_stlv7325_v2`, the board's pins and constraints
#       migen         the HDL it is all written in
#     No CPU is selected, so no `pythondata_cpu_*` core and none of the other LiteX cores
#     (`litedram`, `liteeth`, ...) is imported. `colorama` and `packaging` are loaded too; they
#     are general-purpose third-party packages, not LiteX, and are not listed.
# `xeda run --rebuild-all` generates again regardless. A load with no run root to keep a record
# in (a `Design` built by hand) cannot judge it and generates; `xeda run --dry-run` refuses to
# plan a design that has to generate, and creates nothing.
#
# LiteX names every output after the platform, so the files below are `sitlinv_stlv7325_v2*`,
# not `hdmi_demo*` as the 2023 LiteX the checked-in `hdmi_demo.v` came from named them, and the
# top module is `sitlinv_stlv7325_v2`. The Verilog `$readmemh`s the `.init` (LiteX's SoC
# identifier string, with the build date in it) next to it; it is declared as a `Data` source so
# that `--remote` ships it before the run, where yosys's own list of files read does not exist yet.
# Neither file exists before the first generation, hence `path:` rather than `file:`.
#
# `build/` is the generator's output directory (ignored by git): the script writes more than the
# two sources there, among them its own `sitlinv_stlv7325_v2.xdc`. That one is not used: the
# design's constraints are `hdmi_demo.xdc`, hand-maintained for openXC7 (its Vivado-only
# properties and some false paths are commented out), and generating beside it would overwrite it.
# `hdmi_demo.v` and `hdmi_demo_mem.init` here are the 2023 files that `make` builds; xeda does not
# read them.
name: hdmi-stlv7325
description: Colorbars on HDMI (TMDS_33) on the STLV7325-v2, a LiteX SoC without a CPU
rtl:
  top: sitlinv_stlv7325_v2
  generator:
    executable: python3
    args: ["hdmi_demo.py", "--build", "--no-compile-gateware", "--output-dir", "build"]
    sources: ["hdmi_demo.py"]
    packages: ["litex", "litex_boards", "migen"]
    generated_sources:
      - "build/gateware/sitlinv_stlv7325_v2.v"
      - "build/gateware/sitlinv_stlv7325_v2_mem.init"
  sources:
    - path: "build/gateware/sitlinv_stlv7325_v2.v"
    - path: "build/gateware/sitlinv_stlv7325_v2_mem.init"
      type: Data
    - "hdmi_demo.xdc"

flows:
  yosys_fpga:
    fpga:
      part: xc7k325tffg676-1
