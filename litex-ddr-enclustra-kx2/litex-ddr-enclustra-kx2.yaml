# xeda design for litex-ddr-enclustra-kx2: what `make -C litex-ddr-enclustra-kx2` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found.
name: litex-ddr-enclustra-kx2
rtl:
  top: enclustra_mercury_kx2
  sources:
    - enclustra_mercury_kx2.v
    - ../vexriscv/VexRiscv.v
    - enclustra_mercury_kx2.xdc
flows:
  yosys_fpga:
    fpga:
      part: xc7k160tffg676-2
  nextpnr:
    timing_allow_fail: true
