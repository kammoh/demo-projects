# xeda design for blinky-digilent-arty: what `make -C blinky-digilent-arty` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run fpga_pack blinky-digilent-arty/blinky-digilent-arty.yaml
name: blinky-digilent-arty
description: Blink an LED from a 25-bit counter on the Digilent Arty A7-35T
rtl:
  top: blinky
  sources:
    - blinky.v
    - blinky.xdc

flows:
  yosys_fpga:
    fpga:
      part: xc7a35tcsg324-1
