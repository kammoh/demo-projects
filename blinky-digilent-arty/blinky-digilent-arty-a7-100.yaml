# xeda design for blinky-digilent-arty on the Arty A7-100T: what
# `make -C blinky-digilent-arty PART=xc7a100tcsg324-1` builds (the Makefile's own part is the
# A7-35T's, see blinky-digilent-arty.yaml). Build it from the repository root, so that
# `xedaproject.yaml` is found:
#   xeda run fpga_pack blinky-digilent-arty/blinky-digilent-arty-a7-100.yaml
name: blinky-digilent-arty-a7-100
description: Blink an LED from a 25-bit counter on the Digilent Arty A7-100T
rtl:
  top: blinky
  sources:
    - blinky.v
    - blinky.xdc

flows:
  vivado_synth:
    fpga.part: xc7a100tcsg324-1
  yosys_fpga:
    fpga.part: xc7a100tcsg324-1
  openfpgaloader:
    # In capitals, as the bundled board database spells it: xeda matches board names exactly
    # for now. Any letter case will do once it matches them case-insensitively.
    board: ARTY_A7_100T
    # Repeats the board's part: a `vivado_synth+openfpgaloader` run still asks for `fpga` beside
    # `board`. Not needed once xeda takes the part from the board for that run too.
    fpga.part: xc7a100tcsg324-1
