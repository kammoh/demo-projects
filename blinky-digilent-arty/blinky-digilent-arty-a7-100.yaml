# xeda design for blinky-digilent-arty-a7-100: what `make -C blinky-digilent-arty PART=xc7a100tcsg324-1` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run fpga_pack blinky-digilent-arty/blinky-digilent-arty-a7-100.yaml
name: blinky-digilent-arty-a7-100
description: Blink an LED from a 25-bit counter on the Digilent Arty A7-100T
rtl:
  top: blinky
  sources:
    - blinky.v
    - blinky.xdc

flows:
  vivado_synth:
    fpga.part: xc7a100tcsg324-1
  yosys_fpga:
    fpga.part: xc7a100tcsg324-1
  openfpgaloader:
    board: arty_a7_100t
