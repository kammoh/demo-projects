# xeda design for litex-sata-alientek-davincipro: what `make -C litex-sata-alientek-davincipro` builds.
# Build it from the repository root, so that `xedaproject.yaml` is found:
#   xeda run fpga_pack litex-sata-alientek-davincipro/litex-sata-alientek-davincipro.yaml
name: litex-sata-alientek-davincipro
description: LiteX SoC with a SATA core (GTP transceivers) on the Alientek DavinciPro
rtl:
  top: litex_pcie
  sources:
    # litex_pcie_*.init, read by `$readmemh`, are not listed: xeda tracks the files yosys reads
    - litex_pcie.v
    - ../vexriscv/VexRiscv.v
    - litex_pcie.xdc

flows:
  yosys_fpga:
    fpga:
      part: xc7a35tfgg484-2
  nextpnr:
    timing_allow_fail: true
